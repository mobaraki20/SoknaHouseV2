name: SoknaHouse QA2 / MariaDB Staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-mariadb.yml'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soknahouse-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-mariadb:
    name: Disposable DB, install, migration, concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa-only-root-password-2026
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      SOKNA_QA_CI_ROOT_PASSWORD: qa-only-root-password-2026
    steps:
      - name: Fetch staging test files
        uses: actions/checkout@v4
      - name: Install PHP and MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-mysql php8.3-mbstring php8.3-zip mariadb-client python3
          php --version
          php -m | grep -E '^(PDO|pdo_mysql|mbstring|zip|json)$'
      - name: Run pinned QA2 real database validation
        run: python3 qa/ci/staging_runner.py
      - name: Test real dev24 UpdateManagerV2 on disposable DB with injected faults
        run: python3 qa/ci/update_staging_runner.py
      - name: Reproduce legacy snapshot gap and verify QA2 isolation/recovery on disposable MariaDB
        run: python3 qa/ci/update_safety_runner.py
      - name: Rehearse offline-first guard bridge before dev24 upgrade (disposable only)
        env:
          SOKNA_QA_DISPOSABLE: 'YES'
        run: python3 qa/ci/dev24_offline_bridge_runner.py
      - name: Build exact QA3 paired staging archives (clean and update)
        run: python3 qa/ci/build_qa3_candidate.py .
      - name: Real financial, reservation, backup and exact-package acceptance on disposable MariaDB
        env:
          SOKNA_QA_DISPOSABLE: 'YES'
        run: python3 qa/ci/qa3_financial_e2e_runner.py
      - name: Preserve staging result without DB credentials or data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soknahouse-qa2-mariadb-results
          path: |
            staging-ci-report.json
            staging-update-ci-report.json
            staging-update-safety-report.json
            staging-offline-bridge-ci-report.json
            staging-qa3-business-ci-report.json
            SOKNAHOUSE_2.6.19-dev.25-qa3-bridge_STAGING_CLEAN_INSTALL.zip
            SOKNAHOUSE_dev24-to-2.6.19-dev.25-qa3-bridge_STAGING_UPDATE_DO_NOT_DEPLOY.zip
            SOKNAHOUSE_QA3_STAGING_PACKAGE_MANIFEST_20261114.json
          if-no-files-found: warn
          retention-days: 14